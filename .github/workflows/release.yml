name: Publicar versão
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/PhotoView.html
          body: |
            ## Como usar
            1. Em **Assets**, logo abaixo, clique em **PhotoView.html** para baixar.
            2. Abra o arquivo baixado com dois cliques (ele abre no navegador).
            3. Clique em **Pasta inteira** e escolha a pasta das suas fotos.

            Não baixe "Source code": isso é o código para programadores.
            Prefere não baixar nada? Use pelo site: https://luccabueno.github.io/photoview/
